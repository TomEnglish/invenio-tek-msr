<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0369a1">
    <title>Racks - Invenio Field MSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20261116racks">
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>

</head>

<body>
<section class="work-page">
    <header class="work-page-header"><div><p class="eyebrow">Logistics</p><h1>Racks</h1><p class="text-muted">The storage locations inside this project's yards and sites. Stock is received onto a rack. A retired rack stays on record but is no longer offered.</p><p id="projectLine" class="fw-semibold mb-0"></p></div><div class="work-page-actions"><button type="button" id="addRack" class="btn btn-primary" hidden>Add rack</button></div></header>
    <p id="pageMessage" role="status" aria-live="polite" tabindex="-1"></p>
    <section id="setupPanel" class="card mb-3" aria-labelledby="setupTitle" hidden><div class="card-body"><h2 id="setupTitle" class="h6"></h2><ul id="setupSteps" class="setup-steps"></ul></div></section>
    <section class="card mb-3" aria-label="Filters"><div class="card-body inventory-filters">
        <label for="filterPlace">Yard or site<select id="filterPlace" class="form-select"></select></label>
        <label for="filterSearch">Search<input type="search" id="filterSearch" class="form-control" placeholder="Zone, row, rack, yard or area" autocomplete="off"></label>
    </div></section>
    <div class="inventory-toolbar"><div class="view-switch" role="group" aria-label="Show"><button type="button" id="showActive" class="btn btn-sm" aria-pressed="true">Active</button><button type="button" id="showRetired" class="btn btn-sm" aria-pressed="false">Retired</button></div><p id="resultSummary" class="small text-muted mb-0" role="status"></p></div>
    <section class="card" aria-label="Racks">
        <div class="table-responsive"><table class="table"><thead><tr><th scope="col">Rack</th><th scope="col">Yard or site</th><th scope="col">Area on the site plan</th><th scope="col">Capacity</th></tr></thead><tbody id="rackRows"></tbody></table></div>
    </section>
</section>
<dialog id="rackDrawer" class="review-drawer" aria-labelledby="rackTitle"><div id="rackContent"></div><p id="rackStatus" class="small mt-2 mb-0" role="status" aria-live="polite"></p></dialog>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260424f"></script>
    <script src="js/utils/constants.js?v=20260424f"></script>
    <script src="js/utils/formatting.js?v=20260424f"></script>
    <script src="js/utils/branding.js?v=20261010portal"></script>
    <script src="js/utils/supabase-client.js?v=20260424f"></script>
    <script src="js/utils/project-scope.js?v=20261116racks"></script>
    <script src="js/utils/user-access.js?v=20260908a"></script>
    <script src="js/utils/auth-guard.js?v=20260908a"></script>
    <script src="js/utils/sidebar.js?v=20261116racks"></script>
    <script src="js/utils/inventory-helpers.js?v=20261028area3"></script>
    <script src="js/utils/yard-setup.js?v=20261116racks"></script>
    <script src="racks.js?v=20261116racks"></script>
</body>
</html>
