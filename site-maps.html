<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0369a1">
    <title>Site Maps - Invenio Field MSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=20261028area2">
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>

</head>

<body>
<section class="work-page">
    <header class="work-page-header"><div><p class="eyebrow">Initial inventory</p><h1>Site Maps</h1><p class="text-muted">Upload a plan of the site and draw its areas, nested as deep as you need (T1 Pipe Racks › Rack 2). Field crews choose an area, and can drop a pin, for every item they count.</p></div><div class="work-page-actions"><label for="mapSelect" id="mapSelectLabel" hidden>Map<select id="mapSelect" class="form-select"></select></label><button type="button" id="newMap" class="btn btn-primary" hidden>New map</button></div></header>
    <p id="pageMessage" role="status" aria-live="polite" tabindex="-1"></p>
    <div id="mapWorkspace" class="site-map-layout" hidden>
        <section class="card site-map-card" aria-labelledby="mapTitle">
            <div class="card-header"><div><h2 id="mapTitle" class="h6 mb-0"></h2><span id="mapMeta" class="small text-muted"></span></div><div id="mapActions" class="d-flex flex-wrap gap-2"></div></div>
            <div id="drawBar" class="site-map-toolbar" hidden><span id="drawHint" role="status"></span><span class="d-flex gap-2"><button type="button" id="undoPoint" class="btn btn-sm btn-outline">Undo point</button><button type="button" id="finishZone" class="btn btn-sm btn-primary">Finish area</button><button type="button" id="cancelDraw" class="btn btn-sm btn-ghost">Cancel</button></span></div>
            <div id="siteMap" class="site-map-canvas" role="region" aria-label="Site plan"></div>
            <div id="mapEmpty" class="card-body" hidden><p id="mapEmptyText" class="mb-0 text-muted">This map has no plan image yet.</p></div>
        </section>
        <aside class="card site-map-panel" aria-labelledby="zonesTitle">
            <div class="card-header"><h2 id="zonesTitle" class="h6 mb-0">Areas</h2><button type="button" id="drawZone" class="btn btn-sm btn-primary" hidden>Draw area</button></div>
            <div class="card-body"><ul id="zoneList" class="zone-list" aria-labelledby="zonesTitle"></ul><div id="zoneEditor" hidden></div></div>
        </aside>
    </div>
</section>
<dialog id="mapDialog" class="review-drawer" aria-labelledby="mapDialogTitle"><div id="mapDialogContent"></div></dialog>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="supabase-config.js?v=20260424f"></script>
    <script src="js/utils/constants.js?v=20260424f"></script>
    <script src="js/utils/formatting.js?v=20260424f"></script>
    <script src="js/utils/branding.js?v=20261010portal"></script>
    <script src="js/utils/supabase-client.js?v=20260424f"></script>
    <script src="js/utils/project-scope.js?v=20261028area2"></script>
    <script src="js/utils/user-access.js?v=20260908a"></script>
    <script src="js/utils/auth-guard.js?v=20260908a"></script>
    <script src="js/utils/sidebar.js?v=20261028area2"></script>
    <script src="js/utils/inventory-helpers.js?v=20261028area2"></script>
    <script src="js/utils/site-map-view.js?v=20261028area2"></script>
    <script src="site-maps.js?v=20261028area2"></script>
</body>
</html>
