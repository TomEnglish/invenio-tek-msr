<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0369a1">
    <title>User Management - Invenio Field MSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260812a">
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>
    <style>
        .user-admin-header { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:1.5rem; }
        .user-admin-header h1 { font-size:1.6rem; margin:0 0 .35rem; }
        .user-admin-header p { margin:0; color:var(--text-muted); }
        .user-toolbar { display:flex; gap:.75rem; align-items:end; flex-wrap:wrap; margin-bottom:1rem; }
        .user-toolbar .search-wrap { flex:1 1 260px; }
        .user-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
        .user-table { width:100%; border-collapse:collapse; }
        .user-table th { background:var(--raised); color:var(--text-muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; padding:.75rem 1rem; white-space:nowrap; }
        .user-table td { border-top:1px solid var(--border); padding:.8rem 1rem; vertical-align:middle; }
        .user-table tbody tr:hover { background:var(--border-light); }
        .user-name { font-weight:600; color:var(--text-primary); }
        .user-email { color:var(--text-muted); font-size:.8rem; }
        .user-badge { display:inline-flex; align-items:center; gap:.35rem; border-radius:999px; padding:.22rem .6rem; font-size:.75rem; font-weight:600; white-space:nowrap; }
        .user-badge.active { color:#166534; background:#dcfce7; }
        .user-badge.inactive { color:#991b1b; background:#fee2e2; }
        .role-badge { color:var(--primary); background:var(--primary-light); }
        [data-theme="dark"] .user-badge.active { color:#bbf7d0; background:#14532d; }
        [data-theme="dark"] .user-badge.inactive { color:#fecaca; background:#7f1d1d; }
        .user-empty { padding:3rem 1rem; text-align:center; color:var(--text-muted); }
        .user-empty i { font-size:2rem; margin-bottom:.75rem; opacity:.55; }
        .user-pagination { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.85rem 1rem; border-top:1px solid var(--border); color:var(--text-muted); font-size:.85rem; }
        .project-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.5rem; max-height:220px; overflow:auto; padding:.25rem; }
        .project-option { border:1px solid var(--border); border-radius:8px; padding:.65rem .75rem; display:flex; gap:.55rem; align-items:flex-start; cursor:pointer; }
        .project-option:hover { background:var(--border-light); }
        .project-option small { display:block; color:var(--text-muted); }
        @media (max-width:768px) { .user-admin-header { flex-direction:column; } .user-table { min-width:760px; } .user-card { overflow-x:auto; } .user-pagination { min-width:760px; } }
    </style>
</head>

<body data-required-role="admin">
    <section class="user-admin-header">
        <div>
            <h1><i class="fas fa-users-cog me-2"></i>User Management</h1>
            <p>Invite team members and control their roles, access, and project assignments.</p>
        </div>
        <button class="btn btn-primary" id="btnInviteUser"><i class="fas fa-user-plus me-2"></i>Invite User</button>
    </section>

    <div id="userPageMessage" class="alert d-none" role="status"></div>

    <section class="user-toolbar" aria-label="User filters">
        <div class="search-wrap">
            <label class="form-label mb-1" for="userSearch">Search users</label>
            <input class="form-control" id="userSearch" type="search" placeholder="Search by name or email">
        </div>
        <button class="btn btn-outline-primary" id="btnSearchUsers"><i class="fas fa-search me-1"></i>Search</button>
        <button class="btn btn-outline-secondary" id="btnRefreshUsers" title="Refresh users" aria-label="Refresh users"><i class="fas fa-sync-alt"></i></button>
    </section>

    <section class="user-card" aria-labelledby="userDirectoryTitle">
        <div class="d-flex justify-content-between align-items-center p-3">
            <h2 class="h5 mb-0" id="userDirectoryTitle">User directory</h2>
            <span class="text-muted small" id="userCount"></span>
        </div>
        <div class="table-responsive">
            <table class="user-table">
                <thead><tr><th scope="col">User</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col">Projects</th><th scope="col">Last sign-in</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
                <tbody id="userTableBody"><tr><td colspan="6" class="user-empty"><i class="fas fa-spinner fa-spin d-block"></i>Loading users...</td></tr></tbody>
            </table>
        </div>
        <div class="user-pagination">
            <span id="userPageInfo">Page 1</span>
            <div class="d-flex gap-2"><button class="btn btn-sm btn-outline-secondary" id="btnPrevUsers" disabled>Previous</button><button class="btn btn-sm btn-outline-secondary" id="btnNextUsers" disabled>Next</button></div>
        </div>
    </section>

    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5" id="userModalTitle">Invite User</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <form id="userForm">
                <div class="modal-body">
                    <div id="formMessage" class="alert d-none" role="alert"></div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label" for="userEmail">Email</label><input class="form-control" id="userEmail" type="email" autocomplete="email" required></div>
                        <div class="col-md-6"><label class="form-label" for="userFullName">Full name</label><input class="form-control" id="userFullName" type="text" autocomplete="name" maxlength="120" required></div>
                        <div class="col-md-6"><label class="form-label" for="userRole">Role</label><select class="form-select" id="userRole" required><option value="field_worker">Field worker</option><option value="office_staff">Office staff</option><option value="admin">Administrator</option></select></div>
                        <div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" id="userIsActive" type="checkbox" checked><label class="form-check-label" for="userIsActive">Active account</label></div></div>
                        <div class="col-12"><label class="form-label">Project access</label><div class="project-list" id="projectList"><span class="text-muted small">Loading projects...</span></div><div class="form-text">Users can only view and edit data in assigned projects.</div></div>
                    </div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" id="btnSaveUser">Save User</button></div>
            </form>
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260424f"></script>
    <script src="js/utils/constants.js?v=20260424f"></script>
    <script src="js/utils/formatting.js?v=20260424f"></script>
    <script src="js/utils/branding.js?v=20260424f"></script>
    <script src="js/utils/supabase-client.js?v=20260424f"></script>
    <script src="js/utils/project-scope.js?v=20260428a"></script>
    <script src="js/utils/user-access.js?v=20260812a"></script>
    <script src="js/utils/auth-guard.js?v=20260812a"></script>
    <script src="js/utils/sidebar.js?v=20260812a"></script>
    <script src="js/utils/admin-users-client.js?v=20260812a"></script>
    <script src="user-admin.js?v=20260812a"></script>
</body>
</html>
