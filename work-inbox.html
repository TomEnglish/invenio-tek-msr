<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0369a1">
    <title>Work Inbox - Invenio Field MSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260909ui">
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>

</head>

<body>
<section class="work-page">
    <header class="work-page-header"><div><p class="eyebrow">Receiving exceptions</p><h1>Work Inbox</h1><p class="text-muted">Assign an owner and record the next decision. Items on hold remain open.</p></div><label for="inboxFilter">Show<select id="inboxFilter" class="form-select"><option value="open">Open exceptions</option><option value="mine">Assigned to me</option><option value="overdue">Overdue</option><option value="unassigned">Unassigned</option><option value="all">All exceptions</option></select></label></header>
    <p id="staffMessage" class="source-warning small" role="status" hidden>Owner choices could not be loaded. Current assignments will be kept; reload this page to retry.</p>
    <p id="pageMessage" role="status" aria-live="polite" tabindex="-1"></p>
    <div id="inboxEntries" class="inbox-list"></div>
    <button type="button" id="inboxMore" class="btn btn-outline-primary mt-3" hidden>Load more</button>
</section>
<dialog id="exceptionReview" class="review-drawer" aria-labelledby="reviewTitle"><div id="reviewContent"></div></dialog>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/utils/supabase-client.js?v=20260424f"></script>
    <script src="js/utils/project-scope.js?v=20260908a"></script>
    <script src="js/utils/user-access.js?v=20260908a"></script>
    <script src="js/utils/auth-guard.js?v=20260908a"></script>
    <script src="js/utils/sidebar.js?v=20260909ui"></script>
    <script src="js/utils/admin-users-client.js?v=20260908a"></script>
    <script src="js/utils/work-summary.js?v=20260909ui"></script>
    <script src="work-pages.js?v=20260909ui"></script>
</body>
</html>
