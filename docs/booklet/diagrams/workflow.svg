<svg viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How work flows, step by step, across the office, the yard crew, the truck and driver, and the shops and sites: set up, count and receive, store and pack, plan the load, check in and load out, depart, deliver, and wrap up" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#122c4c"/></marker>
  </defs>
  <!-- lane backgrounds -->
  <g>
    <rect x="76" y="0" width="145" height="590" fill="#eef2f9"/>
    <rect x="225" y="0" width="145" height="590" fill="#edf6f0"/>
    <rect x="374" y="0" width="145" height="590" fill="#f4f1ea"/>
    <rect x="523" y="0" width="145" height="590" fill="#f4eff6"/>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <text x="148" y="20" fill="#1b3f9e">Office</text>
    <text x="297" y="20" fill="#0f5c38">Yard crew</text>
    <text x="446" y="20" fill="#6b4e12">Truck and driver</text>
    <text x="595" y="20" fill="#5d2a8c">Shops and sites</text>
  </g>
  <!-- row labels -->
  <g font-size="10" font-weight="700" fill="#122c4c">
    <text x="4" y="62">1 Set up</text>
    <text x="4" y="130">2 Count and</text><text x="16" y="143">receive</text>
    <text x="4" y="198">3 Store and</text><text x="16" y="211">pack</text>
    <text x="4" y="266">4 Plan the</text><text x="16" y="279">load</text>
    <text x="4" y="334">5 Check in,</text><text x="16" y="347">load out</text>
    <text x="4" y="402">6 Depart</text>
    <text x="4" y="470">7 Deliver</text>
    <text x="4" y="538">8 Wrap up</text>
  </g>
  <g stroke="#d6dce6" stroke-width="1">
    <line x1="0" y1="96" x2="680" y2="96"/><line x1="0" y1="164" x2="680" y2="164"/><line x1="0" y1="232" x2="680" y2="232"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="368" x2="680" y2="368"/><line x1="0" y1="436" x2="680" y2="436"/>
    <line x1="0" y1="504" x2="680" y2="504"/>
  </g>
  <!-- boxes -->
  <g font-size="9.6" fill="#1c2533">
    <rect x="82" y="38" width="133" height="52" rx="5" fill="#fff" stroke="#174fda"/>
    <text x="89" y="54">Places, site plans, areas;</text><text x="89" y="67">racks linked to areas;</text><text x="89" y="80">crate labels; users</text>

    <rect x="231" y="106" width="133" height="52" rx="5" fill="#fff" stroke="#157347"/>
    <text x="238" y="122">Count what's there, by</text><text x="238" y="135">tag and area; receive</text><text x="238" y="148">deliveries at the gate</text>

    <rect x="231" y="174" width="133" height="52" rx="5" fill="#fff" stroke="#157347"/>
    <text x="238" y="190">Put away in areas;</text><text x="238" y="203">pack crates and seal;</text><text x="238" y="216">move crates as they go</text>

    <rect x="82" y="242" width="133" height="52" rx="5" fill="#fff" stroke="#174fda"/>
    <text x="89" y="258">Load: origin, stops,</text><text x="89" y="271">carrier companies; plan</text><text x="89" y="284">each piece to its stop</text>
    <rect x="231" y="250" width="133" height="38" rx="5" fill="#fff" stroke="#157347" stroke-dasharray="4 3"/>
    <text x="238" y="266">or start a load for a</text><text x="238" y="279">truck that turns up</text>

    <rect x="231" y="310" width="133" height="52" rx="5" fill="#fff" stroke="#157347"/>
    <text x="238" y="326">Driver check-in: name,</text><text x="238" y="339">phone, licence + photo;</text><text x="238" y="352">scan each piece on</text>
    <rect x="380" y="316" width="133" height="40" rx="5" fill="#fff" stroke="#9a6b00"/>
    <text x="387" y="332">Outside carrier's truck</text><text x="387" y="345">at our yard</text>

    <rect x="231" y="378" width="133" height="52" rx="5" fill="#fff" stroke="#157347"/>
    <text x="238" y="394">Depart: licence on file,</text><text x="238" y="407">or the office records</text><text x="238" y="420">why it left without</text>
    <rect x="380" y="384" width="133" height="40" rx="5" fill="#fff" stroke="#9a6b00"/>
    <text x="387" y="400">On the road: stops in</text><text x="387" y="413">order; office can reroute</text>

    <rect x="529" y="446" width="133" height="52" rx="5" fill="#fff" stroke="#7a3fb0"/>
    <text x="536" y="462">Our yards and sites: the</text><text x="536" y="475">crew scans pieces off</text><text x="536" y="488">and finishes the stop</text>
    <rect x="82" y="446" width="133" height="52" rx="5" fill="#fff" stroke="#174fda"/>
    <text x="89" y="462">Shops and vendors: the</text><text x="89" y="475">office confirms delivery</text><text x="89" y="488">and pick-ups there</text>

    <rect x="82" y="514" width="133" height="66" rx="5" fill="#fff" stroke="#174fda"/>
    <text x="89" y="530">Missing pieces: scan,</text><text x="89" y="543">mark found or write off;</text><text x="89" y="556">close the load; licence</text><text x="89" y="569">kept 365 days</text>
    <rect x="231" y="514" width="133" height="52" rx="5" fill="#fff" stroke="#157347"/>
    <text x="238" y="530">Back at the yard:</text><text x="238" y="543">unpack crates into</text><text x="238" y="556">areas; count, correct</text>
  </g>
  <!-- flow arrows -->
  <g stroke="#122c4c" stroke-width="1.4" fill="none">
    <path d="M215 64 C 240 64 250 80 270 104" marker-end="url(#wa)"/>
    <line x1="297" y1="158" x2="297" y2="172" marker-end="url(#wa)"/>
    <path d="M231 214 C 190 220 160 228 150 240" marker-end="url(#wa)"/>
    <path d="M150 294 C 160 304 220 312 229 330" marker-end="url(#wa)"/>
    <line x1="297" y1="362" x2="297" y2="376" marker-end="url(#wa)"/>
    <line x1="364" y1="404" x2="378" y2="404" marker-end="url(#wa)"/>
    <path d="M513 414 C 560 420 590 430 595 444" marker-end="url(#wa)"/>
    <path d="M420 424 C 410 446 300 444 217 458" marker-end="url(#wa)"/>
    <path d="M150 498 C 150 504 150 506 150 512" marker-end="url(#wa)"/>
    <path d="M595 498 C 590 520 440 520 366 532" marker-end="url(#wa)"/>
  </g>
</svg>
