<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0369a1">
    <title>Loads - Invenio Field MSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20261101keep">
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>

</head>

<body>
<section class="work-page">
    <header class="work-page-header"><div><p class="eyebrow">Logistics</p><h1>Loads</h1><p class="text-muted">Truck loads with outside carriers: where each truck stops, what is on it and what arrived. Field crews scan pieces on and off; the office plans loads and finishes what nobody scans.</p></div><div class="work-page-actions"><button type="button" id="newLoad" class="btn btn-primary" hidden>New load</button></div></header>
    <p id="pageMessage" role="status" aria-live="polite" tabindex="-1"></p>
    <p id="housekeeping" class="small text-muted" role="status" aria-live="polite" hidden></p>
    <section id="licenceWarning" class="licence-warning" aria-labelledby="licenceWarningTitle" hidden></section>
    <div class="inventory-toolbar"><div class="view-switch" role="group" aria-label="Show"><button type="button" id="showOpen" class="btn btn-sm" aria-pressed="true">Open loads</button><button type="button" id="showFinished" class="btn btn-sm" aria-pressed="false">Closed and cancelled</button><button type="button" id="showField" class="btn btn-sm" aria-pressed="false" hidden>Started in the field</button></div><p id="resultSummary" class="small text-muted mb-0" role="status"></p></div>
    <div id="loadBoard" class="load-board"></div>
</section>
<dialog id="loadDrawer" class="review-drawer load-drawer" aria-labelledby="loadTitle"><div id="loadHeader"></div><fieldset id="loadBody" class="load-body"></fieldset><p id="loadStatus" class="small mt-2 mb-0" role="status" aria-live="polite"></p></dialog>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260424f"></script>
    <script src="js/utils/constants.js?v=20260424f"></script>
    <script src="js/utils/formatting.js?v=20260424f"></script>
    <script src="js/utils/branding.js?v=20261010portal"></script>
    <script src="js/utils/supabase-client.js?v=20260424f"></script>
    <script src="js/utils/project-scope.js?v=20261101keep"></script>
    <script src="js/utils/user-access.js?v=20260908a"></script>
    <script src="js/utils/auth-guard.js?v=20260908a"></script>
    <script src="js/utils/sidebar.js?v=20261101keep"></script>
    <script src="js/utils/inventory-helpers.js?v=20261028area3"></script>
    <script src="js/utils/loads-helpers.js?v=20261101keep"></script>
    <script src="loads.js?v=20261101keep"></script>
</body>
</html>
