<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0369a1">
    <title>Crates - Invenio Field MSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20261029places">
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>

</head>

<body>
<section class="work-page">
    <header class="work-page-header"><div><p class="eyebrow">Logistics</p><h1>Crates</h1><p class="text-muted">Crates, skids, bundles and containers packed in the field: what they hold and where they are. A printed label becomes a crate the first time a field crew packs it.</p></div><div class="work-page-actions"><button type="button" id="printLabels" class="btn btn-primary" hidden>Print crate labels</button></div></header>
    <p id="pageMessage" role="status" aria-live="polite" tabindex="-1"></p>
    <section class="card mb-3" aria-label="Filters"><div class="card-body inventory-filters">
        <label for="filterStatus">Status<select id="filterStatus" class="form-select"></select></label>
        <label for="filterSearch">Search<input type="search" id="filterSearch" class="form-control" placeholder="Crate code or description" autocomplete="off"></label>
    </div></section>
    <div class="inventory-toolbar"><p id="resultSummary" class="small text-muted mb-0" role="status"></p></div>
    <section class="card" aria-label="Crates">
        <div class="table-responsive"><table class="table"><thead><tr><th scope="col">Code</th><th scope="col">Description</th><th scope="col">Status</th><th scope="col">Where</th><th scope="col">Contents</th><th scope="col">Sealed</th></tr></thead><tbody id="unitRows"></tbody></table></div>
        <div class="card-body" id="tableFooter" hidden><button type="button" id="tableMore" class="btn btn-outline">Show more</button></div>
    </section>
</section>
<dialog id="unitDrawer" class="review-drawer" aria-labelledby="unitTitle"><div id="unitContent"></div></dialog>
<dialog id="labelDialog" class="review-drawer" aria-labelledby="labelTitle"><div id="labelContent"></div></dialog>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="supabase-config.js?v=20260424f"></script>
    <script src="js/utils/constants.js?v=20260424f"></script>
    <script src="js/utils/formatting.js?v=20260424f"></script>
    <script src="js/utils/branding.js?v=20261010portal"></script>
    <script src="js/utils/supabase-client.js?v=20260424f"></script>
    <script src="js/utils/project-scope.js?v=20261029places"></script>
    <script src="js/utils/user-access.js?v=20260908a"></script>
    <script src="js/utils/auth-guard.js?v=20260908a"></script>
    <script src="js/utils/sidebar.js?v=20261029places"></script>
    <script src="js/utils/logistics-helpers.js?v=20261101keep"></script>
    <script src="handling-units.js?v=20261101keep"></script>
</body>
</html>
