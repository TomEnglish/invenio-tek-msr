<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0369a1">
    <title>Inventory Categories - Invenio Field MSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20261028area2">
    <style>html:not(.auth-ready) body { visibility: hidden; }</style>

</head>

<body>
<section class="work-page">
    <header class="work-page-header"><div><p class="eyebrow">Initial inventory</p><h1>Inventory Categories</h1><p class="text-muted">The tree field crews pick from when they count. Proposals from the field wait below for review.</p></div><div class="work-page-actions"><label class="form-check"><input type="checkbox" id="showArchived" class="form-check-input"> Show archived</label><button type="button" id="addRootCategory" class="btn btn-primary" hidden>Add top-level category</button></div></header>
    <p id="pageMessage" role="status" aria-live="polite" tabindex="-1"></p>
    <section class="card mb-4" aria-labelledby="proposedTitle"><div class="card-header"><h2 id="proposedTitle" class="h6 mb-0">Proposed by field crews</h2><span id="proposedCount" class="chip chip-warn">0</span></div><div id="proposedList" class="card-body"></div></section>
    <section class="card" aria-labelledby="treeTitle"><div class="card-header"><h2 id="treeTitle" class="h6 mb-0">Category tree</h2><div class="d-flex gap-2"><button type="button" id="expandAll" class="btn btn-sm btn-ghost">Expand all</button><button type="button" id="collapseAll" class="btn btn-sm btn-ghost">Collapse all</button></div></div><div class="card-body"><ul id="categoryTree" class="category-tree" aria-labelledby="treeTitle"></ul></div></section>
</section>
<dialog id="categoryDialog" class="review-drawer" aria-labelledby="categoryDialogTitle"><div id="categoryDialogContent"></div></dialog>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260424f"></script>

    <script src="js/utils/formatting.js?v=20260424f"></script>
    <script src="js/utils/branding.js?v=20261010portal"></script>
    <script src="js/utils/supabase-client.js?v=20260424f"></script>
    <script src="js/utils/project-scope.js?v=20261028area2"></script>
    <script src="js/utils/user-access.js?v=20260908a"></script>
    <script src="js/utils/auth-guard.js?v=20260908a"></script>
    <script src="js/utils/sidebar.js?v=20261028area2"></script>
    <script src="js/utils/inventory-helpers.js?v=20261028area2"></script>
    <script src="inventory-categories.js?v=20261028area2"></script>
</body>
</html>
