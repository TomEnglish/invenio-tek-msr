name: Release to production
# Moves the newest commit of main onto a production: its database, its admin
# function, then its office site, and confirms all three. Dev first: nothing
# starts until every dev environment is entirely at that commit.
# See docs/ENVIRONMENTS.md, "Releasing".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: A production in environments.json, or "all" for each in turn, in the order listed there
        required: true
        default: all
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Only main is released
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow from main. A release is always of a commit on main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        env:
          TARGET: ${{ inputs.environment }}
        run: echo "plan=$(node scripts/release.mjs plan "$TARGET")" >> "$GITHUB_OUTPUT"
  dev-first:
    name: Dev first (${{ matrix.environment }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.plan).dev }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - name: The site, admin function and database of ${{ matrix.environment }} are at this commit
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/release.mjs check "$ENVIRONMENT"
  release:
    name: Release to ${{ matrix.environment }}
    needs: [plan, dev-first]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      # One production at a time, in the listed order; a failure stops the rest.
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.plan).production }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: release-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      # The job moves the production's release branch, so this checkout keeps
      # its credentials. RELEASE_DEPLOY_KEY (a write key for this repository
      # only) is needed whenever a release includes a change to a workflow
      # file, which the workflow's own token is not allowed to push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: ./.github/actions/release-tools
        with:
          cli: 'true'
      - name: Database, admin function, site, then confirm all three are at this commit
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release.mjs release "$ENVIRONMENT"
