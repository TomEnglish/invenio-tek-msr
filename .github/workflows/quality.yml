name: Quality and release checks
on:
  push:
    # A release branch only ever receives commits already checked on main.
    branches-ignore:
      - 'release/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  # A run on main may be releasing to dev; it is never cut off part-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: msr
          persist-credentials: false
      - uses: ./msr/.github/actions/release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: msr/requirements-import.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Browser logic and publication boundary
        working-directory: msr
        run: node --test tests/*.test.js
      - name: Edge function validation and behavior
        working-directory: msr
        run: |
          deno test --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_SECRET_KEY,INVITATION_TTL_SECONDS,INVITATION_EMAIL_ENABLED,SITE_URL tests/admin-users-handler.test.ts tests/admin-users-validation.test.ts
          deno check supabase/functions/admin-users/index.ts
      - name: Workbook validation and transactional import contract
        working-directory: msr
        run: |
          python -m pip install -r requirements-import.txt
          python -m unittest discover -s tests -p '*_test.py'
      - name: Permissions, operations, imports, releases, and actual concurrent transactions
        working-directory: msr
        run: bash tests/database/run.sh
      - name: Publish only checked browser assets
        working-directory: msr
        # The web host builds each site for its own environment; this build of
        # the first production in environments.json is kept as the checked artifact.
        run: APP_ENV="$(node scripts/environments.mjs list --kind production | head -n 1)" node scripts/build-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: msr-browser-${{ github.sha }}
          path: msr/dist
          retention-days: 7
  # Dev first: a merge to main is released to every dev environment, and to
  # nothing else. A production is released by the "Release to production"
  # workflow, which runs only when dev is entirely at the same commit.
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        run: echo "plan=$(node scripts/release.mjs plan)" >> "$GITHUB_OUTPUT"
  dev:
    name: Release to ${{ matrix.environment }}
    needs: [quality, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.plan).dev }}
    # Secrets come from the repository environment of the same name.
    environment: ${{ matrix.environment }}
    concurrency:
      group: release-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          cli: 'true'
      - name: Database, admin function, then confirm the site, function and database are at this commit
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::The $ENVIRONMENT database is not set up for releases: its repository environment has no DATABASE_URL secret. Its migrations were neither applied nor checked."
            node scripts/release.mjs release "$ENVIRONMENT" --skip-database
          else
            node scripts/release.mjs release "$ENVIRONMENT"
          fi
