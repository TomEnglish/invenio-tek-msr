name: Samsara handover required
# The live hourly job remains in TomEnglish/MSR_F6B. Never start a second
# writer or reuse the legacy anonymous-key script against the shared database.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handover-required:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the required migration
        run: |
          echo "::error::Sync is not configured in this repository. See docs/INTEGRATION_OWNERSHIP.md. The legacy job still runs in TomEnglish/MSR_F6B; migrate credentials, explicit project mapping and server-only writes before enabling a schedule here."
          exit 1
